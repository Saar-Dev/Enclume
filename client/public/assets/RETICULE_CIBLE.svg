<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="-32 -32 64 64"
     width="128"
     height="128"
     color="black">

    <defs>
        <filter id="glow"
                x="-60%" y="-60%"
                width="220%" height="220%">
            <feGaussianBlur stdDeviation="1.8" result="blur"/>
            <feMerge>
                <feMergeNode in="blur"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
    </defs>

    <!-- Crochets épais et lumineux (gauche/droite) -->
    <path
        d="M -12 -30 L -16 -27 L -18 -25 L -18 25 L -16 27 L -12 30
             M 12 -30 L 16 -27 L 18 -25 L 18 25 L 16 27 L 12 30"
        fill="none"
        stroke="#ffffff"
        stroke-width="3"
        stroke-linecap="round"
        stroke-linejoin="round"
        filter="url(#glow)"/>

    <!-- Traits internes (gauche) -->
    <path
        d="M -16 -23 L -10 -17 M -16 23 L -10 17"
        fill="none"
        stroke="#777"
        stroke-width="1"
        stroke-dasharray="1.5,1.5"
        stroke-linecap="round"
        opacity="0.8"/>

    <!-- Traits internes (droite) -->
    <path
        d="M 16 -23 L 10 -17 M 16 23 L 10 17"
        fill="none"
        stroke="#777"
        stroke-width="1"
        stroke-dasharray="1.5,1.5"
        stroke-linecap="round"
        opacity="0.8"/>
</svg>